services:
  - type: web
    name: finagentx
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false
      - key: USE_MOCK_DATA
        value: "true"
      - key: SIMULATION_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_TRADE_SIZE_PCT
        value: "10"
      - key: MAX_RISK_SCORE
        value: "70"
      - key: DATABASE_URL
        fromDatabase:
          name: finagentx-db
          property: connectionString

databases:
  - name: finagentx-db
    plan: free
    region: oregon
