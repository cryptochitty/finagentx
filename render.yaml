services:
  # ── FastAPI backend ────────────────────────────────────────────────────
  - type: web
    name: finagentx-api
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: LLM_PROVIDER
        value: mock                        # swap to gemini/openai in Render dashboard
      - key: LLM_API_KEY
        sync: false                        # set secret in Render dashboard
      - key: USE_MOCK_DATA
        value: "true"
      - key: SIMULATION_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"                         # tighten to vercel domain after first deploy
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_TRADE_SIZE_PCT
        value: "10"
      - key: MAX_RISK_SCORE
        value: "70"
      - key: DATABASE_URL
        fromDatabase:
          name: finagentx-db
          property: connectionString

  # ── PostgreSQL database ────────────────────────────────────────────────
databases:
  - name: finagentx-db
    plan: free
    region: oregon
